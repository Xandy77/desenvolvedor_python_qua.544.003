{% extends "base.html" %}

{% block content %}
    <div class= "container">
        <div class="row justify-content-center align-items-center min-vh-content" >
            <div class="col-md-6">
                <div class = "card p-4 shadow-lg">
                    <img src="{{ url_for('static', filename='img/ocr.png')}}" alt="Logo OCR" class="img-fluid mx-auto d-block mb-4" width="200"
                    <h3 class = "card-title text-center mb=4">
                        Extraia um texto de uma imagem aqui!
                    </h3>
                    <form action="" method="POST" enctype="multipart/form-data">
                        <label for="image" class="form-label">
                            Selecione uma imagem:
                        </label>
                        <input type="file" class="form-control" name="imagem" accept="img/*" value="" required>
                    
                
                        <button type="submit" class="btn btn-success w-100 mt-3">
                            Extrair texto
                        </button>
                    </form>
                </div>
            </div>                    
        </div>
    </div>
{% endblock %}
